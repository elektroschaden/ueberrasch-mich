name: Update Berlin places
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OSM reader
        run: python -m pip install osmium
      - name: Download Geofabrik Berlin/Brandenburg extract
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            --output region.osm.pbf \
            https://download.geofabrik.de/europe/germany/brandenburg-latest.osm.pbf
          test -s region.osm.pbf
      - name: Build static place list
        run: python import_places.py
      - name: Commit updated place data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add places.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Berlin area places"
            git push
          fi
