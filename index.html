<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f1e7"><title>Überrasch mich!</title><style>
*{box-sizing:border-box}body{font:16px system-ui;background:#f6f1e7;color:#15261f;margin:0;padding:24px;min-height:100dvh;display:grid;place-items:center}main{width:min(100%,440px)}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(38px,10vw,54px);margin:0}p,small{color:#6a675c}fieldset{border:0;padding:0;margin:26px 0}legend{font-weight:650;margin-bottom:12px}.radios{display:flex;gap:8px}.radios label{flex:1;text-align:center;padding:12px 5px;border:1px solid #d5ccbb;border-radius:12px}.radios input{accent-color:#15261f}.choices label{display:block;padding:9px 0}.choices input{accent-color:#15261f}button,a.route{display:block;width:100%;border:0;border-radius:12px;padding:17px;background:#15261f;color:white;font:650 17px system-ui;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}.secondary{background:transparent;color:#15261f;border:1px solid #c9c0b0;margin-top:12px}.card{background:#fffdf8;border:1px solid #e4dccb;border-radius:16px;padding:24px;margin-top:24px}.hidden{display:none!important}.big{font:34px Georgia,serif;margin:12px 0}.overlay{position:fixed;inset:0;background:#15261f88;display:grid;place-items:center;padding:20px}.modal{width:min(100%,410px);background:#fffdf8;border-radius:20px;padding:28px}.modal h2{font-size:32px;margin:0}.modal p{line-height:1.5}#status,#err{min-height:24px;font-size:14px}footer{margin-top:30px;font-size:12px;color:#6a675c}footer a{color:inherit}</style>
<main><h1>Überrasch mich.</h1><p>Rausgehen. Ohne lange nachzudenken.</p><fieldset><legend>Wie weit darf’s sein?</legend><div class="radios"><label><input name="radius" type="radio" value="3">3 km</label><label><input name="radius" type="radio" value="7" checked>7 km</label><label><input name="radius" type="radio" value="15">15 km</label></div></fieldset><fieldset><legend>Worauf hast du Lust?</legend><div class="choices"><label><input name="category" type="radio" value="all" checked>Völlig egal. Überrasch mich!</label><label><input name="category" type="radio" value="nature">Draußen & Natur</label><label><input name="category" type="radio" value="food">Kaffee & Essen</label><label><input name="category" type="radio" value="culture">Kultur & Kurioses</label></div></fieldset><button id="go">ÜBERRASCH MICH!</button><p id="status" role="status"></p><section id="result" class="card hidden"><div id="teaser"><small>DEIN NÄCHSTES ZIEL</small><div id="distance" class="big"></div><p>Was es ist? Wird noch nicht verraten.</p><button id="reveal">Ziel aufdecken</button></div><div id="revealed" class="hidden"><small>DEIN ÜBERRASCHUNGSZIEL</small><div id="place" class="big"></div><p id="kind"></p><a id="route" class="route" target="_blank" rel="noopener">Route öffnen</a></div><button id="again" class="secondary">Nochmal!</button></section><footer>Ortsdaten: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap-Mitwirkende</a> · Entfernungen sind Luftlinie.</footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let pos=null,pool=[],used=new Set(),current=null,lastKey='',busy=false;
const filters={nature:['["leisure"~"^(park|garden)$"]','["tourism"="viewpoint"]','["natural"="beach"]'],food:['["amenity"~"^(cafe|restaurant|ice_cream)$"]'],culture:['["tourism"~"^(museum|gallery|attraction)$"]','["historic"~"^(monument|castle)$"]']};
const chosen=n=>document.querySelector('input[name="'+n+'"]:checked').value;
const distance=(a,b,c,d)=>{const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,z=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))};
function locate(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no(Error('Standortbestimmung nicht unterstützt.'));navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude}),e=>no(Error(e.code===1?'Bitte erlaube Chrome den Standortzugriff in den Website-Einstellungen.':'Standort konnte nicht bestimmt werden.')),{timeout:10000,maximumAge:300000,enableHighAccuracy:false})})}
async function load(lat,lon,r,cat){
 const types=cat==='all'?Object.values(filters).flat():filters[cat];
 const endpoints=['https://overpass.kumi.systems/api/interpreter','https://overpass.nchc.org.tw/api/interpreter'];
 for(let attempt=0;attempt<3;attempt++){
  const angle=Math.random()*Math.PI*2,dist=Math.sqrt(Math.random())*Math.max(.3,r-.5);
  const a=lat+Math.cos(angle)*dist/111.2;
  const b=lon+Math.sin(angle)*dist/(111.2*Math.max(.2,Math.cos(lat*Math.PI/180)));
  const localRadius=r<=3?650:r<=7?900:1300;
  const query='[out:json][timeout:7];('+types.map(t=>'nwr'+t+'["name"](around:'+localRadius+','+a+','+b+');').join('')+');out center 45;';
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),9000);
  try{
   const response=await fetch(endpoints[attempt%endpoints.length],{method:'POST',body:new URLSearchParams({data:query}),signal:ctrl.signal});
   if(!response.ok)continue;
   const data=await response.json();
   const found=data.elements.map(e=>{const x=e.lat??e.center?.lat,y=e.lon??e.center?.lon,n=e.tags?.name?.trim();if(!n||x==null||y==null)return null;const d=distance(lat,lon,x,y);if(d<.25||d>r)return null;return{id:e.type+e.id,name:n,lat:x,lon:y,distance:d,kind:e.tags.amenity?'Kaffee & Essen':e.tags.natural||e.tags.leisure?'Natur & draußen':'Kultur & Kurioses'}}).filter(Boolean);
   if(found.length)return found;
  }catch(e){}finally{clearTimeout(timer)}
 }
 throw Error('Gerade keinen passenden Ort gefunden. Bitte nochmal versuchen.');
}
function pick(){let options=pool.filter(p=>!used.has(p.id));if(!options.length){used.clear();options=pool}if(!options.length)throw Error('Keine Orte gefunden. Bitte Radius vergrößern.');current=options[Math.floor(Math.random()*options.length)];used.add(current.id);$('result').classList.remove('hidden');$('teaser').classList.remove('hidden');$('revealed').classList.add('hidden');$('distance').textContent=current.distance.toLocaleString('de-DE',{maximumFractionDigits:1})+' km entfernt';$('status').textContent=''}
async function surprise(){if(busy)return;busy=true;$('go').disabled=true;$('again').disabled=true;$('result').classList.add('hidden');
 try{
  const p=pos||await locate(),r=+chosen('radius'),cat=chosen('category'),key=r+':'+cat;
  if(true){$('status').textContent='Suche Überraschungen in deiner Nähe …';pool=await load(p.lat,p.lon,r,cat);used.clear();lastKey=key;pos=p}
  pick()
 }catch(e){$('status').textContent=e.message}
 finally{busy=false;$('go').disabled=false;$('again').disabled=false}
}
$('go').onclick=surprise;$('again').onclick=surprise;
$('reveal').onclick=()=>{if(!current)return;$('teaser').classList.add('hidden');$('revealed').classList.remove('hidden');$('place').textContent=current.name;$('kind').textContent=current.kind+' · '+current.distance.toLocaleString('de-DE',{maximumFractionDigits:1})+' km Luftlinie';$('route').href='https://www.openstreetmap.org/directions?engine=fossgis_osrm_foot&route='+encodeURIComponent(pos.lat+','+pos.lon+';'+current.lat+','+current.lon)};
</script></html>
